<div class="list">
    <div class="items mt2" fxLayout="row wrap" fxLayout.lt-md="column">
      <mat-card class="item" *ngFor="let theme of (themes$ | async)" fxFlex>
        <mat-card-header>
          <mat-card-title>{{ theme.titre }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>
            {{ theme.description }}
          </p>
        </mat-card-content>
        <mat-card-actions fxLayoutAlign="center">
          <button mat-raised-button color="primary" >S'abonner </button>
        </mat-card-actions>
      </mat-card>
    </div>
</div>
