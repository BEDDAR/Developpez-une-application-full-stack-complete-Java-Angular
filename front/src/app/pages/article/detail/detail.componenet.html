<div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="5px" [ngStyle.gt-sm]="'margin-left: 30px;'"
  [ngStyle.lt-md]="'padding: 10px;'">

  <mat-icon fxHide.lt-md onclick="history.back()" class="custom-icon">keyboard_backspace</mat-icon>

  <div *ngIf="article" [ngClass.gt-sm]="'item'" fxLayout="column" fxLayoutAlign="start">
    <span fxLayout="row" fxLayoutGap="10px">
      <mat-icon fxHide.gt-sm onclick="history.back()" class="custom-icon">keyboard_backspace</mat-icon>
      <h1 *ngIf="article" style="font-size: 30px;">{{ article.titre}}</h1>
    </span>

    <span fxLayout="row wrap" fxLayoutAlign="start" fxLayoutGap="30px">
      <p>{{article.createdAt | date:'YYYY-MM-dd'}}</p>
      <p>{{article.auteur.userName}}</p>
      <p>{{article.theme.titre}}</p>
    </span>
    <p>
      {{ article.contenu}}
    </p>
    <hr>
    <h3>Commentaires</h3>
    <div>
      <div [ngClass.gt-sm]="'commentaire-container'" [ngClass.lt-sm]="'commentaire-container-mobile'" fxLayoutGap="10px"
        *ngFor=" let commentaire of (article.commentaires) ">
        <p>{{commentaire.auteur.userName}}</p>
        <div [ngClass.lt-md]="'commentaire-contenu-mobile'" [ngClass.gt-sm]="'commentaire-contenu'">
          {{commentaire.contenu}}
        </div>
      </div>
      <form *ngIf="commentaireForm" [formGroup]="commentaireForm" (ngSubmit)="envoyer()" fxLayoutGap="10px"
        style="width: 100%;">
        <mat-form-field appearance="outline">
          <textarea class="textarea-resize" matInput placeholder="Ecrivez ici votre commentaire"
            formControlName="contenu"></textarea>
        </mat-form-field>
        <button type="submit" mat-icon-button>
          <mat-icon class="icon-custom" color="primary">send</mat-icon>
        </button>
      </form>
    </div>
  </div>



</div>
