<div class="register" fxLayout="column" fxLayoutAlign="center center">
  <span fxFlex="0 1 400px" fxLayout="column" fxLayoutAlign="center center">
    <mat-card-header fxLayoutAlign="center center" class="header-spacing">
      <mat-card-title>Inscription</mat-card-title>
    </mat-card-header>

    <form [formGroup]="form" (ngSubmit)="submit()" fxLayout="column" fxLayoutAlign="center stretch">
      <mat-card-content fxLayout="column" fxLayoutGap="10px">
        <span fxLayout="column" fxLayoutGap="1px">
          <label>Nom d'utilisateur</label>
          <input class="input-field" formControlName="userName">
        </span>

        <span fxLayout="column" fxLayoutGap="1px">
          <label>Adresse e-mail</label>
          <input class="input-field" formControlName="email">
        </span>

        <span fxLayout="column" fxLayoutGap="1px">
          <label>Mot de passe</label>
          <input type="password" class="input-field" formControlName="password">
        </span>

      </mat-card-content>

      <mat-card-actions fxLayout="column" fxLayoutAlign="center center" style="margin-top: 20px;">
        <button mat-raised-button color="primary" type="submit" fxFlex="0 1 100%">S'inscrire</button>
      </mat-card-actions>
    </form>
  </span>
</div>
