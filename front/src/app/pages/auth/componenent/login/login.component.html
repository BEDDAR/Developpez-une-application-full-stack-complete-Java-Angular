<div class="login" fxLayout="column" fxLayoutAlign="center center">
  <span fxFlex="0 1 400px" fxLayout="column" fxLayoutAlign="center center">
    <mat-card-header fxLayoutAlign="center center" class="header-spacing">
      <mat-card-title>Se connecter</mat-card-title>
    </mat-card-header>

    <form (ngSubmit)="submit()" fxLayout="column" fxLayoutAlign="center stretch">
      <mat-card-content fxLayout="column" fxLayoutGap="20px">
        <span fxLayout="column" fxLayoutGap="1px">
          <label>E-mail ou nom d'utilisateur</label>
          <input class="input-field">
        </span>

        <span fxLayout="column" fxLayoutGap="1px">
          <label>Mot de passe</label>
          <input type="password" class="input-field">
        </span>

      </mat-card-content>

      <mat-card-actions fxLayout="column" fxLayoutAlign="center center" style="margin-top: 20px;">
        <button mat-raised-button color="primary" type="submit" fxFlex="0 1 100%">Se connecter</button>
      </mat-card-actions>
    </form>
  </span>
</div>
