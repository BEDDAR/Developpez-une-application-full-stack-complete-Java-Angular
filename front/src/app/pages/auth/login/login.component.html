<div class="login" fxLayout="column" fxLayoutAlign="center center">
  <mat-card class="login-card" fxFlex="0 1 400px" fxLayout="column" fxLayoutAlign="center center">
    <mat-card-header fxLayoutAlign="center center">
      <mat-card-title>Se connecter</mat-card-title>
    </mat-card-header>

    <form class="login-form" (ngSubmit)="submit()" fxLayout="column" fxLayoutAlign="center stretch">
      <mat-card-content fxLayout="column" fxLayoutGap="15px">

        <mat-form-field appearance="outline" floatLabel="always" fxFlex="0 1 100%">
          <mat-label>E-mail ou nom d'utilisateur</mat-label>
          <input matInput fxFlex="0 1 100%">
        </mat-form-field>

        <mat-form-field appearance="outline" floatLabel="always" fxFlex="0 1 100%">
          <mat-label>Mot de passe</mat-label>
          <input matInput type="password" fxFlex="0 1 100%">
        </mat-form-field>
      </mat-card-content>

      <mat-card-actions fxLayout="column" fxLayoutAlign="center center">
        <button mat-raised-button color="primary" type="submit" fxFlex="0 1 100%">Se connecter</button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
