<!-- Menu pour les grands écrans -->
<span fxHide.lt-md *ngIf="!(isHomePage || isLoginPage || isRegisterPage)">
  <div fxLayout="row" fxLayoutAlign="space-between center" style="padding: 20px; height: 100px;">
    <img src="/assets/logo_p6.png" alt="logo" routerLink="/" style="max-width: 150px; max-height: 150px;" />
    <div *ngIf="isLogged$ | async" fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="20px">
      <div fxLayout="row" fxLayoutGap="20px">
        <a class="lien" style="color: red;">Se déconnecter</a>
        <a class="lien" routerLink="articles">Articles</a>
        <a class="lien" routerLink="themes">Thèmes</a>
      </div>
      <mat-icon routerLink="me" class="custom-icon">account_circle</mat-icon>
    </div>
  </div>
  <hr />
</span>

<!-- Menu pour les petits écrans -->
<span fxHide.gt-sm *ngIf="!(isHomePage || isLoginPage || isRegisterPage)">
  <div *ngIf="isLogged$ | async" fxLayout="row" fxLayoutAlign="space-between center">
    <img src="/assets/logo_p6.png" alt="logo" routerLink="/" style="max-width: 150px; max-height: 150px;" />
    <mat-drawer-container autosize>
      <!-- Drawer qui glisse de la droite -->
      <mat-drawer #drawer class="example-sidenav" mode="side" position="end">
        <span fxLayout="column" fxLayoutAlign="space-between center" >
          <a class="lien" style="color: red;">Se déconnecter</a>
          <a class="lien" routerLink="articles">Articles</a>
          <a class="lien" routerLink="themes">Thèmes</a>
          <mat-icon routerLink="me" class="custom-icon">account_circle</mat-icon>
        </span>
      </mat-drawer>

      <div class="example-sidenav-content">
        <!-- Bouton pour afficher/fermer le menu -->
        <button type="button" mat-button (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon> <!-- Icône du menu hamburger -->
        </button>
      </div>
    </mat-drawer-container>
  </div>
</span>

<div>
  <router-outlet></router-outlet>
</div>
